Resources:
  WuparkItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Wupark-Pi-Image-Table
      AttributeDefinitions:
        - AttributeName: LotID
          AttributeType: N
        - AttributeName: Timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: LotID
          KeyType: HASH
        - AttributeName: Timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST