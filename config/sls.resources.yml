Resources:
  WuparkItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Wupark-Pi-Image-Table
      AttributeDefinitions:
        - AttributeName: lotNum
          AttributeType: N
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: lotNum
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST