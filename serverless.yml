service: wupark-backend-api

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  stage: prod
  environment:
    TABLE_NAME: WuparkItemsTable
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource: arn:aws:dynamodb:us-east-1:833100170434:table/WuparkItemsTable

functions:
  wupark_items:
    handler: handler.wupark_items
    events:
      - http:
          path: wupark/items
          method: get
          cors: true
      - http:
          path: wupark/items
          method: post
          cors: true
      - http:
          path: wupark/items/{id}
          method: get
          cors: true

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true

resources: ${file(./config/sls.resources.yml)}