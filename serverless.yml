service: wupark-backend-image-processing

frameworkVersion: ~4.27.0

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  stage: prod
  environment:
    IMAGE_TABLE_NAME: Wupark-Pi-Image-Table
    ROBOFLOW_API_KEY: ${env:ROBOFLOW_API_KEY}
    POST_AVAILABILITY_URL: ${env:POST_AVAILABILITY_URL}
    GET_STALL_CONFIG_URL: ${env:GET_STALL_CONFIG_URL}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetRecords
            - dynamodb:GetShardIterator
            - dynamodb:DescribeStream
            - dynamodb:ListStreams
          Resource: arn:aws:dynamodb:us-east-1:833100170434:table/Wupark-Pi-Image-Table/stream/*

functions:
  image_processor:
    handler: image_processor.process_image_stream
    timeout: 300
    events:
      - stream:
          type: dynamodb
          arn: arn:aws:dynamodb:us-east-1:833100170434:table/Wupark-Pi-Image-Table/stream/2025-12-04T18:10:06.697
          batchSize: 10
          startingPosition: LATEST
          enabled: true

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: non-linux
    slim: true
    strip: false
    zip: true
    usePoetry: false
    useDownloadCache: true
    useStaticCache: true
    pipCmdExtraArgs:
      - --no-cache-dir
